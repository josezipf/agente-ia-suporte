<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALEX — Suporte NOC ISP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --accent: #2f81f7;
      --accent-glow: rgba(47,129,247,0.25);
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --text: #e6edf3;
      --muted: #8b949e;
      --user-bg: #1f3f6e;
      --agent-bg: #1c2128;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }
    .avatar {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .header-info h1 { font-size: 16px; font-weight: 700; }
    .header-info p  { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.4; }
    }
    .status-label { font-size: 12px; color: var(--green); margin-left: 6px; }

    /* ── MESSAGES ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 10px; max-width: 780px; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: none; } }

    .msg.user  { align-self: flex-end; flex-direction: row-reverse; }
    .msg.agent { align-self: flex-start; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .msg.agent .msg-avatar { background: linear-gradient(135deg, var(--accent), #7c3aed); }
    .msg.user  .msg-avatar { background: var(--surface2); }

    .bubble {
      padding: 11px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.agent .bubble {
      background: var(--agent-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 2px;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border: 1px solid rgba(47,129,247,.3);
      border-top-right-radius: 2px;
    }

    /* Typing / status indicator */
    .typing .bubble, .status-msg .bubble { padding: 14px 18px; }
    .dots { display: flex; gap: 5px; }
    .dots span {
      width: 7px; height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30%          { transform: translateY(-6px); }
    }
    .status-msg .bubble {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-msg .bubble::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── QUICK ACTIONS ── */
    #quick-actions {
      padding: 0 16px 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
      font-family: inherit;
    }
    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(47,129,247,.08);
    }

    /* ── INPUT AREA ── */
    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      outline: none;
      line-height: 1.5;
      transition: border-color .2s;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--muted); }

    #send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      width: 44px; height: 44px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s;
      flex-shrink: 0;
    }
    #send-btn:hover:not(:disabled) {
      background: #388bfd;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    #send-btn:disabled { background: var(--surface2); cursor: not-allowed; color: var(--muted); }

    /* ── SESSION BAR ── */
    #session-bar {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 6px;
      flex-shrink: 0;
    }
    #session-bar span { color: var(--accent); font-family: monospace; }

    /* ── ERROR TOAST ── */
    #toast {
      position: fixed;
      bottom: 90px; left: 50%;
      transform: translateX(-50%);
      background: var(--red);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 13px;
      display: none;
      z-index: 999;
      animation: fadeIn .2s ease;
    }
  </style>
</head>
<body>

<header>
  <div class="avatar">🤖</div>
  <div class="header-info">
    <h1>ALEX — Suporte Técnico</h1>
    <p>Provedor X · Atendimento Online</p>
  </div>
  <div class="status-dot"></div>
  <span class="status-label">Online</span>
</header>

<div id="messages">
  <div class="msg agent">
    <div class="msg-avatar">🤖</div>
    <div class="bubble">Olá! 😊 Aqui é o ALEX, do suporte técnico. Como posso te ajudar hoje?

Se você está com problemas na sua internet, pode me contar o que está acontecendo que eu já vou verificar aqui pra você!</div>
  </div>
</div>

<div id="quick-actions">
  <button class="quick-btn" onclick="quickSend('Estou sem internet, não consigo acessar nada')">📡 Sem internet</button>
  <button class="quick-btn" onclick="quickSend('Minha internet está muito lenta')">🐢 Muito lenta</button>
  <button class="quick-btn" onclick="quickSend('Minha internet cai e volta o tempo todo')">⚡ Caindo toda hora</button>
  <button class="quick-btn" onclick="quickSend('Meu roteador não está funcionando direito')">📦 Problema no roteador</button>
</div>

<div id="input-area">
  <textarea id="msg-input" placeholder="Descreva seu problema..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()" title="Enviar">➤</button>
</div>

<div id="session-bar">Sessão: <span id="session-id-display">nova</span></div>
<div id="toast"></div>

<script>
  let sessionId = null;
  let isWaiting = false;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const sendBtn    = document.getElementById('send-btn');
  const sessionDisplay = document.getElementById('session-id-display');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  // Enter para enviar (Shift+Enter = nova linha)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function quickSend(text) {
    inputEl.value = text;
    sendMessage();
  }

  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const avatar = role === 'agent' ? '🤖' : '👤';
    div.innerHTML = `
      <div class="msg-avatar">${avatar}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg agent typing';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function showStatus(text) {
    hideTyping();
    let el = document.getElementById('status-indicator');
    if (!el) {
      el = document.createElement('div');
      el.className = 'msg agent status-msg';
      el.id = 'status-indicator';
      el.innerHTML = `<div class="msg-avatar">🤖</div><div class="bubble"></div>`;
      messagesEl.appendChild(el);
    }
    el.querySelector('.bubble').textContent = text;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideStatus() {
    const el = document.getElementById('status-indicator');
    if (el) el.remove();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 4000);
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  async function sendMessage() {
    if (isWaiting) return;
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    appendMessage('user', text);

    isWaiting = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || `Erro HTTP ${res.status}`);
      }

      // Lê o stream SSE
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // guarda linha incompleta

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const event = JSON.parse(line.slice(6));

            if (event.type === 'status') {
              showStatus(event.text);

            } else if (event.type === 'done') {
              hideStatus();
              sessionId = event.session_id;
              sessionDisplay.textContent = sessionId.slice(0, 8) + '...';
              appendMessage('agent', event.response);

            } else if (event.type === 'error') {
              hideStatus();
              showToast('Erro: ' + event.text);
              appendMessage('agent', '⚠️ Houve um problema. Tente novamente.');
            }
          } catch (_) { /* ignora linha malformada */ }
        }
      }

    } catch (err) {
      hideStatus();
      hideTyping();
      showToast('Erro: ' + err.message);
      appendMessage('agent', '⚠️ Houve um problema ao processar sua mensagem. Tente novamente.');
    } finally {
      hideStatus();
      hideTyping();
      isWaiting = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
